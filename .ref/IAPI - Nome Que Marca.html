document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

aturate(1.4) blur(10px);background:rgba(244,240,233,.82);border-bottom:1px solid var(--hair);\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:18px 40px;display:flex;align-items:center;justify-content:space-between;\">\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <div style=\"width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Spectral',serif;font-weight:500;font-size:15px;\">n<\u002Fdiv>\n        <div style=\"line-height:1;\">\n          <div style=\"font-family:'Spectral',serif;font-size:17px;font-weight:500;letter-spacing:.01em;\">Nome Que Marca<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.22em;color:var(--soft);margin-top:3px;text-transform:uppercase;\">IAPI · Inteligência de Marcas<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <nav style=\"display:flex;align-items:center;gap:30px;font-size:14px;color:var(--soft);\">\n        <span style=\"cursor:pointer;\">Plataforma<\u002Fspan>\n        <span style=\"cursor:pointer;\">Módulos<\u002Fspan>\n        <span style=\"cursor:pointer;\">INPI<\u002Fspan>\n        <span style=\"cursor:pointer;\">Clientes<\u002Fspan>\n      <\u002Fnav>\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <button onclick=\"{{ goLogin }}\" style=\"background:none;border:none;font-family:'Hanken Grotesk',sans-serif;font-size:14px;color:var(--ink);cursor:pointer;font-weight:500;\">Entrar<\u002Fbutton>\n        <button onclick=\"{{ goLogin }}\" style=\"background:var(--ink);color:var(--paper);border:none;padding:11px 20px;border-radius:999px;font-family:'Hanken Grotesk',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;transition:transform .2s,background .2s;\" style-hover=\"background:var(--wine);transform:translateY(-1px);\">Solicitar demonstração<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section style=\"max-width:1240px;margin:0 auto;padding:90px 40px 70px;display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;\">\n    <div>\n      <div style=\"display:inline-flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--wine);text-transform:uppercase;margin-bottom:26px;\">\n        <span style=\"width:26px;height:1px;background:var(--wine);\"><\u002Fspan>Busca · Monitoramento · Registro no INPI\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Spectral',serif;font-weight:400;font-size:62px;line-height:1.04;letter-spacing:-.015em;margin:0 0 26px;text-wrap:balance;\">\n        A plataforma que cuida das <span style=\"font-style:italic;color:var(--wine);\">marcas que marcam<\u002Fspan>.\n      <\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:var(--soft);max-width:520px;margin:0 0 38px;\">\n        Do nome ao registro. Centralize naming, processos no INPI, prazos, clientes e financeiro num só lugar — com a inteligência e o cuidado que uma marca de verdade merece.\n      <\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:18px;\">\n        <button onclick=\"{{ goApp }}\" style=\"background:var(--wine);color:#fff;border:none;padding:15px 28px;border-radius:999px;font-family:'Hanken Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px -10px rgba(124,46,56,.5);\" style-hover=\"transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(124,46,56,.55);\">Entrar na plataforma →<\u002Fbutton>\n        <button onclick=\"{{ goLogin }}\" style=\"background:none;border:1px solid var(--hair);padding:15px 26px;border-radius:999px;font-family:'Hanken Grotesk',sans-serif;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink);transition:border .2s;\" style-hover=\"border-color:var(--ink);\">Ver demonstração<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:44px;margin-top:56px;\">\n        <div><div style=\"font-family:'Spectral',serif;font-size:34px;line-height:1;\">+2.400<\u002Fdiv><div style=\"font-size:12.5px;color:var(--soft);margin-top:7px;\">marcas nomeadas<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;background:var(--hair);\"><\u002Fdiv>\n        <div><div style=\"font-family:'Spectral',serif;font-size:34px;line-height:1;\">98%<\u002Fdiv><div style=\"font-size:12.5px;color:var(--soft);margin-top:7px;\">de deferimento no INPI<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;background:var(--hair);\"><\u002Fdiv>\n        <div><div style=\"font-family:'Spectral',serif;font-size:34px;line-height:1;\">15 anos<\u002Fdiv><div style=\"font-size:12.5px;color:var(--soft);margin-top:7px;\">de autoridade verbal<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- dossiê mock -->\n    <div style=\"position:relative;\">\n      <div style=\"position:absolute;inset:-14px -14px 28px 28px;border:1px solid var(--hair);border-radius:18px;\"><\u002Fdiv>\n      <div style=\"position:relative;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:26px;box-shadow:0 30px 60px -34px rgba(34,28,22,.4);\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--hair);\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--soft);\">DOSSIÊ · 923.481.207<\u002Fdiv>\n          <div style=\"display:inline-flex;padding:4px 10px;border-radius:999px;background:rgba(91,110,82,.14);color:#3F5A3A;font-size:11px;font-weight:600;\">Deferido<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-size:30px;margin:18px 0 4px;\">Lumière<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--soft);margin-bottom:22px;\">Cosméticos · Classe NCL 3 · Mista<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:co >\n          <button style=\"background:var(--ink);color:var(--paper);border:none;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;\">+ Novo lead<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start;\">\n          <sc-for list=\"{{ leadColumns }}\" as=\"col\" hint-placeholder-count=\"5\">\n            <div style=\"min-width:240px;flex:1;background:rgba(34,28,22,.035);border:1px solid var(--hair);border-radius:14px;padding:14px;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:2px 6px 14px;\"><div style=\"font-size:12.5px;font-weight:600;\">{{ col.title }}<\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);\">{{ col.value }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;\">\n                <sc-for list=\"{{ col.items }}\" as=\"l\" hint-placeholder-count=\"2\">\n                  <div style=\"background:var(--card);border:1px solid var(--hair);border-radius:11px;padding:14px;cursor:grab;transition:box-shadow .2s,transform .2s;\" style-hover=\"box-shadow:0 8px 20px -12px rgba(34,28,22,.3);transform:translateY(-1px);\">\n                    <div style=\"font-size:13.5px;font-weight:600;margin-bottom:3px;\">{{ l.empresa }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:var(--soft);margin-bottom:11px;\">{{ l.nome }} · {{ l.interesse }}<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;\">{{ l.valor }}<\u002Fspan><span style=\"font-size:10.5px;color:var(--soft);background:rgba(34,28,22,.05);padding:3px 8px;border-radius:999px;\">{{ l.origem }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n    <div style=\"padding:14px 32px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--soft);\"><span>IAPI · NOME QUE MARCA · v1.0<\u002Fspan><span>TODA MARCA QUE MARCA DEVE SER REGISTRADA<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Bordô&quot;,&quot;Verde profundo&quot;,&quot;Petróleo&quot;],&quot;default&quot;:&quot;Bordô&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tema&quot;},&quot;storytelling&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Tema&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'home', caso: null, cliente: null };\n\n  go(s) { try { window.scrollTo(0, 0); } catch(e){} this.setState({ screen: s, caso: null, cliente: null }); }\n\n  renderVals() {\n    const P = this.props || {};\n    const accentMap = { 'Verde profundo': ['#3E5B45','rgba(62,91,69,.09)'], 'Petróleo': ['#2C4A52','rgba(44,74,82,.09)'], 'Bordô': ['#7C2E38','rgba(124,46,56,.08)'] };\n    const [wine, wineSoft] = accentMap[P.accent] || accentMap['Bordô'];\n    const sc = this.state.screen;\n    const parent = { caso: 'casos', cliente: 'clientes' };\n    const active = parent[sc] || sc;\n\n    // ---- badge helper ----\n    const tones = {\n      ok:['#3F5A3A','rgba(91,110,82,.15)'], warn:['#8A5A1E','rgba(176,122,46,.16)'],\n      danger:['#8C2F2F','rgba(155,58,58,.13)'], bronze:['#A24A1E','rgba(188,90,44,.15)'],\n      wine:[wine,wineSoft], neutral:['#6E655B','rgba(34,28,22,.07)'], info:['#3A5560','rgba(58,85,96,.13)']\n    };\n    const badge = (label, kind) => {\n      const [fg,bg] = tones[kind]||tones.neutral;\n      return { label, style:`display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:600 11px/1 'Hanken Grotesk',sans-serif;letter-spacing:.01em;color:${fg};background:${bg};white-space:nowrap;` };\n    };\n    const av = (bg, size) => `width:${size}px;height:${size}px;border-radius:50%;background:${bg};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Spectral',serif;font-weight:500;font-size:${size*0.4}px;flex-shrink:0;`;\n    const avatars = ['#7C2E38','#22314F','#BC5A2C','#3A5560','#5E6B52','#8A4A52'];\n    const ini = (n) => n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();\n\n    // ---- nav ----\n    const navDef = [\n      { label:'Visão geral', items:[ ['dashboard','Dashboard','01'], ['analytics','Analytics','02'] ] },\n      { label:'Inteligência INPI', items:[ ['busca','Busca INPI','03'], ['monitoramento','Monitoramento','04','5'], ['dominios','Domínios & Redes','05'] ] },\n      { label:'Meus processos', items:[ ['casos','Meus Pedidos','06','12'], ['prazos','Prazos','07','3'], ['tarefas','Tarefas','08'], ['agenda','Agenda','09'] ] },\n      { label:'Relacionamento', items:[ ['clientes','Clientes','10'], ['leads','Leads & Propostas','11'] ] },\n      { label:'Gestão', items:[ ['financeiro','Financeiro','12'], ['usuarios','Usuários','13'] ] },\n    ];\n    const nav = navDef.map(g => ({ label:g.label, items: g.items.map(([id,label,num,bdg]) => {\n      const on = active===id;\n      return { id, label, num, badge: bdg||'',\n        onClick: ()=>this.go(id),\n        style:`display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;font:500 13.5px/1.1 'Hanken Grotesk',sans-serif;text-decoration:none;transition:background .2s,color .2s;${on?'background:rgba(244,240,233,.09);color:#F4F0E9;':'color:#9C9286;'}`,\n        numStyle:`font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;width:18px;${on?`color:${'#BC5A2C'};`:'color:rgba(156,146,134,.5);'}`\n      };\n    })}));\n\n    // ---- home content ----\n    const modules = [\n      ['M1','Naming','Briefs, rodadas de nomes e validação criativa.'],\n      ['M2','Identidade Verbal','Slogans, manifestos e dicionário de marca.'],\n      ['M3','Casos & Processos','Pipeline completo de registro no INPI.'],\n      ['M4','Prazos','Decêndios e concessões com alerta antecipado.'],\n      ['M5','Clientes','CRM editorial com histórico de relacionamento.'],\n      ['M6','Agenda & Tarefas','Operação diária organizada por prioridade.'],\n      ['M7','Financeiro','Contas, contratos e indicadores de receita.'],\n      ['M8','Analytics','Inteligência estratégica da carteira de marcas.'],\n    ].map(([num,name,desc])=>({num,name,desc}));\n    const flow = [\n      ['01','Brief','Entendemos o negócio, o público e o território da marca.'],\n      ['02','Criação','Geramos e validamos nomes e a identidade verbal.'],\n      ['03','Depósito','Protocolamos o pedido no INPI na classe certa.'],\n      ['04','Registro','Acompanhamos cada prazo até o certificado em mãos.'],\n    ].map(([n,title,desc])=>({n,title,desc}));\n\n    // ---- dashboard ----\n    const kpis = [\n      { label:'Processos ativos', value:'184', delta:'↑ 12', sub:'no mês', deltaColor:'#3F5A3A' },\n      { label:'Prazos · 7 dias', value:'12', delta:'3 críticos', sub:'', deltaColor:wine },\n      { label:'Marcas deferidas', value:'9', delta:'↑ 3', sub:'vs. maio', deltaColor:'#3F5A3A' },\n      { label:'Receita do mês', value:'R$ 248k', delta:'↑ 18%', sub:'YoY', deltaColor:'#3F5A3A' },\n    ];\n    const pipeline = [\n      { label:'Busca prévia', count:'18', pct:'14%', color:'#3A5560' },\n      { label:'Em exame', count:'72', pct:'56%', color:wine },\n      { label:'Publicado / oposição', count:'31', pct:'34%', color:'#BC ina A.'],\n      ['Comprovação de uso','Lumière','923.481.207','Lumière Cosméticos','11','JUL','em 15 dias','medio','Comprovação','Carla M.'],\n      ['Pagamento de retribuição','Cobalto','923.541.262','Cobalto Tech','22','JUL','em 26 dias','baixo','Pagamento','Financeiro'],\n    ];\n    const prazos = prazosRaw.map(r=>({ titulo:r[0], marca:r[1], numero:r[2], cliente:r[3], dia:r[4], mes:r[5], vence:r[6], urgColor:urg[r[7]], responsavel:r[9], ...(()=>{ const b=badge(r[8],'neutral'); return { tipo:r[8], tipoStyle:b.style }; })() }));\n    const prazosTop = prazos.slice(0,4);\n\n    // ---- tarefas ----\n    const tarefasRaw = [\n      ['Validar lista de nomes — Cobalto','Cobalto Tech','Alta','A fazer','Marina A.'],\n      ['Redigir manifesto de marca — Raiz','Raiz Alimentos','Média','A fazer','Carla M.'],\n      ['Responder exigência INPI — Verbo','Verbo Editora','Alta','Em andamento','Marina A.'],\n      ['Preparar proposta — Ostra & Sal','Ostra & Sal','Média','Em andamento','João P.'],\n      ['Revisar dicionário verbal — Aurora','Aurora Clínica','Baixa','Em revisão','Carla M.'],\n      ['Enviar certificado — Lumière','Lumière Cosméticos','Alta','Concluída','Financeiro'],\n    ];\n    const priKind = { Alta:'wine', 'Média':'bronze', Baixa:'neutral' };\n    const tarefas = tarefasRaw.map((r,i)=>{ const b=badge(r[2], priKind[r[2]]); return { titulo:r[0], cliente:r[1], prioridade:r[2], priStyle:b.style, status:r[3], responsavel:r[4], resInit:ini(r[4]), avStyle:av(avatars[i%avatars.length],26), prazo:['Hoje','Amanhã','2 dias','3 dias','Sex','Ok'][i] }; });\n    const tarefasTop = tarefas.filter(t=>t.status!=='Concluída').slice(0,4);\n    const cols = ['A fazer','Em andamento','Em revisão','Concluída'];\n    const colDots = { 'A fazer':'#6E655B','Em andamento':wine,'Em revisão':'#BC5A2C','Concluída':'#3E5B45' };\n    const taskColumns = cols.map(c=>{ const items = tarefas.filter(t=>t.status===c); return { title:c, dot:colDots[c], count:items.length, items }; });\n\n    /
